<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fd3ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="굴착 연습장" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>굴착 연습장</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div class="top">
        <div class="chips">
          <div class="chip" id="chip-dig"><b>굴착</b><span id="dig">0/4</span></div>
          <div class="chip" id="chip-dump"><b>덤프</b><span id="dump">0</span></div>
        </div>
        <div class="actions">
          <div class="timer" id="timer">4:00</div>
          <button class="btn small" id="btn-settings" title="설정">⚙</button>
          <button class="btn small danger" id="btn-end">그만하기</button>
        </div>
      </div>
      <div class="guide" id="guide"></div>
      <div class="mission" id="mission" hidden>
        <div class="m-head" id="m-head"></div>
        <div class="m-text" id="m-text"></div>
        <div class="m-meter" id="m-meter" hidden><b class="band"></b><b class="fill"></b><b class="needle"></b></div>
        <div class="m-pips" id="m-pips"></div>
      </div>
      <div class="toasts" id="toasts"></div>

      <button class="lab-toggle" id="btn-labels" title="레버 글자"></button>
      <div class="stick left" id="stick-l">
        <div class="ring"></div>
        <div class="knob"></div>
        <span class="lab up">암 펴기</span>
        <span class="lab down">암 당기기</span>
        <span class="lab lt">선회&nbsp;◀</span>
        <span class="lab rt">▶&nbsp;선회</span>
      </div>
      <div class="stick right" id="stick-r">
        <div class="ring"></div>
        <div class="knob"></div>
        <span class="lab up">붐 내림</span>
        <span class="lab down">붐 올림</span>
        <span class="lab lt">버킷 오므림</span>
        <span class="lab rt">버킷 펴기</span>
      </div>

      <div class="console">
        <span class="load soil"><b>버킷</b><i class="bar"><i id="loadbar"></i></i></span>
        <button class="cam-btn" id="btn-cam" title="시점"></button>
        <button class="btn small" id="btn-engine" hidden>시동</button>
      </div>
      <div class="endring" id="endring"></div>
    </div>

    <div class="modal page" id="precheck">
      <div class="card start">
        <header class="sp-head">
          <!-- 종목 전환: 굴착(실기) · 주행(실기) · 필기. 주행·필기는 준비 중 -->
          <div class="sp-kind" id="sp-kind">
            <button class="on" data-kind="dig"></button>
            <button class="soon" data-kind="drive"></button>
            <button class="soon" data-kind="written"></button>
          </div>
          <button class="card-gear" id="btn-settings2" title="설정">⚙</button>
        </header>
        <div class="mode-pick" id="mode-pick"></div>
        <p class="fs-hint" id="fs-hint" hidden>전체화면: 공유 → <b>홈 화면에 추가</b></p>
      </div>
    </div>

    <div class="modal" id="settings" hidden>
      <div class="card settings-card">
        <div class="tabs">
          <button data-tab="sound">소리</button>
          <button data-tab="machine">굴착기</button>
          <button data-tab="seat">좌석 높이</button>
          <button data-tab="keys">조작키</button>
        </div>
        <section data-pane="sound">
          <div class="vol-row all"><span>전체</span><button class="mute" id="mute-all"></button></div>
          <div class="vol-row"><span>엔진음</span><button class="mute" id="mute-eng">🔊</button><input type="range" id="vol-eng" min="0" max="100" /></div>
          <div class="vol-row"><span>환경음</span><button class="mute" id="mute-amb">🔊</button><input type="range" id="vol-amb" min="0" max="100" /></div>
          <div class="vol-row"><span>효과음</span><button class="mute" id="mute-sfx">🔊</button><input type="range" id="vol-sfx" min="0" max="100" /></div>
        </section>
        <section data-pane="machine" hidden>
          <div class="site-cur" id="site-cur"></div>
          <div class="machine-pick" id="machine-pick"></div>
          <div class="site-tools">
            <input class="site-q" id="site-q" type="search" placeholder="시험장 검색 (예: 광주)" autocomplete="off" />
            <button class="btn small" id="btn-near">📍 가까운 곳</button>
          </div>
          <div class="site-list" id="site-list"></div>
        </section>
        <section data-pane="keys" hidden>
          <div class="key-grid" id="key-grid"></div>
        </section>
        <section data-pane="seat" hidden>
          <div class="ruler" id="ruler">
            <div class="ruler-fill" id="ruler-fill"><span class="ruler-handle">🧍 <b id="height-val">170cm</b></span></div>
            <i style="bottom: 0%">150</i><i style="bottom: 22.2%">160</i><i style="bottom: 44.4%">170</i><i style="bottom: 66.7%">180</i><i style="bottom: 88.9%">190</i>
          </div>
        </section>
        <div class="set-foot">
          <button class="btn" id="btn-keys-reset" hidden>기본값</button>
          <button class="btn big go" id="btn-settings-ok">확인</button>
        </div>
      </div>
    </div>

    <div class="modal page" id="lessons" hidden>
      <div class="card wide lessons-card">
        <div class="ls-head"><button class="btn small" id="btn-lessons-back">◀</button><h1>배우기</h1><span class="ls-count" id="stage-count"></span></div>
        <div class="stage-map" id="stage-map"></div>
      </div>
    </div>

    <div id="clear" hidden>
      <div class="cl-rays"></div>
      <div class="cl-box">
        <div class="cl-stars"><i>★</i><i>★</i><i>★</i></div>
        <div class="cl-word">CLEAR!</div>
        <div class="cl-title" id="clear-title"></div>
        <div class="cl-btns">
          <button class="btn" id="btn-clear-map">목록</button>
          <button class="btn big go" id="btn-clear-next">다음 ▶</button>
          <button class="btn big go" id="btn-clear-exam" hidden>자유 연습으로 ▶</button>
        </div>
      </div>
    </div>

    <div id="fail" hidden>
      <div class="sheet">
        <div class="fs-ico">!</div>
        <div class="fs-body">
          <div class="fs-title">다시!</div>
          <div class="fs-reason" id="fail-detail"></div>
        </div>
        <button class="btn ghost" id="btn-fail-map">목록</button>
        <button class="btn big go fs-go" id="btn-fail-retry"><span id="fail-retry-ico"></span>다시 하기</button>
      </div>
    </div>

    <div class="modal" id="paywall" hidden>
      <div class="card pw">
        <button class="pw-x" id="btn-paywall-close" title="닫기"></button>
        <div class="pw-visual">
          <div class="modebtn tier-mid"><b>연습 시험</b></div>
          <div class="modebtn tier-boss"><b>실제 시험</b></div>
        </div>
        <div class="pw-info">
          <h1 id="pw-title">연습 시험 · 실제 시험 열기</h1>
          <ul class="pw-perks" id="pw-perks"></ul>
          <button class="btn big pw-buy" id="btn-buy"></button>
          <button class="pw-restore" id="btn-restore">구매 복원</button>
        </div>
      </div>
    </div>
    <div id="paid" hidden><span id="paid-ico"></span>결제 완료</div>

    <div class="modal" id="result" hidden>
      <div class="card wide">
        <div class="stamp" id="stamp"></div>
        <h1 id="res-title"></h1>
        <div class="cols" id="res-cols">
          <section>
            <h2>실격 판정</h2>
            <ul id="res-dq"></ul>
          </section>
          <section>
            <div class="hero" id="res-hero"></div>
            <div class="checks" id="res-checks"></div>
          </section>
        </div>
        <div class="res-btns">
          <button class="btn" id="btn-home">처음으로</button>
          <button class="btn big go" id="btn-retry">다시 하기</button>
        </div>
      </div>
    </div>


    <div id="ready-flash" hidden>호각!</div>
    <div id="dq-banner" hidden><b>실격</b><span id="dq-why"></span></div>
    <div id="boss-intro" hidden>
      <div class="bi-bg"></div>
      <div class="bi-flash"></div>
      <div class="bi-tag" id="bi-tag"></div>
      <div class="bi-title" id="bi-title"></div>
      <div class="bi-sub" id="bi-sub"></div>
    </div>
    <div id="perf" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
